networks:
  opens3-network:
    driver: bridge

volumes:
  sppr-model-registry:
  pgdata-sppr:
  pgdata-users:
  pgdata-metadata:
  neo4j-data:
  neo4j-logs:
  neo4j-plugins:
  storage-data:
  storage-hot-data:
  jaeger-data:
  prometheus-data:
  grafana-data:
  es_data:

services:

  # СППР можно поднять отдельно от Gateway и остальных прикладных сервисов.
  postgres-sppr:
    profiles: [sppr]
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: sppr_db
      POSTGRES_USER: sppr_user
      POSTGRES_PASSWORD: sppr_password
    ports:
      - "${SPPR_DB_PORT:-5436}:5432"
    volumes:
      - pgdata-sppr:/var/lib/postgresql/data
    networks: [opens3-network]
    healthcheck:
      test: [CMD-SHELL, "pg_isready -U sppr_user -d sppr_db"]
      interval: 2s
      timeout: 1s
      retries: 15

  migrator-sppr:
    profiles: [sppr]
    image: migrate/migrate:v4.19.1
    volumes:
      - ./services/sppr/migrations:/migrations:ro
    command: ["-path", "/migrations", "-database", "postgres://sppr_user:sppr_password@postgres-sppr:5432/sppr_db?sslmode=disable", "up"]
    networks: [opens3-network]
    depends_on:
      postgres-sppr:
        condition: service_healthy

  sppr:
    profiles: [sppr]
    build:
      context: .
      dockerfile: services/sppr/Dockerfile
    environment:
      HTTP_ADDRESS: 0.0.0.0:8086
      SHUTDOWN_TIMEOUT: 15s
      PG_DSN: postgres://sppr_user:sppr_password@postgres-sppr:5432/sppr_db?sslmode=disable
      PG_TIMEOUT: 5s
      PG_LOGGING: "false"
      KAFKA_BOOTSTRAP: kafka:29092
      KAFKA_OBJECT_READ_TOPIC: "${KAFKA_OBJECT_READ_TOPIC:-object-read}"
      KAFKA_OBJECT_WRITTEN_TOPIC: "${KAFKA_OBJECT_WRITTEN_TOPIC:-object-written}"
      KAFKA_CONSUMER_GROUP_ID: sppr
      KAFKA_RETRY_INTERVAL: 1s
      LOGGER_LEVEL: info
      LOGGER_AS_JSON: "true"
      LOGGER_ENABLE_OLTP: "false"
      OTEL_SERVICE_NAME: sppr
      OTEL_SERVICE_VERSION: 0.1.0
      OTEL_ENVIRONMENT: development
      OTEL_EXPORTER_OTLP_ENDPOINT: otel-collector:4317
      OTEL_METRICS_PUSH_TIMEOUT: 10s
      MIGRATION_ENABLED: "${MIGRATION_ENABLED:-false}"
      MIGRATION_CLEANUP_INTERVAL: "${MIGRATION_CLEANUP_INTERVAL:-30s}"
      MIGRATION_WORKERS: "${MIGRATION_WORKERS:-2}"
      MIGRATION_MAX_ATTEMPTS: "${MIGRATION_MAX_ATTEMPTS:-5}"
      MIGRATION_RETRY_BACKOFF: "${MIGRATION_RETRY_BACKOFF:-1s}"
      MIGRATION_SOURCE_CLEANUP_DELAY: "${MIGRATION_SOURCE_CLEANUP_DELAY:-10m}"
      GATEWAY_MAX_READ_DURATION: "${GATEWAY_MAX_READ_DURATION:-5m}"
      MIGRATION_BUDGET_BYTES: "${MIGRATION_BUDGET_BYTES:-1GiB}"
      MIGRATION_BUDGET_WINDOW: "${MIGRATION_BUDGET_WINDOW:-1h}"
      MIGRATION_MIN_INTERVAL: "${MIGRATION_MIN_INTERVAL:-1h}"
      PLANNER_ENABLED: "${PLANNER_ENABLED:-false}"
      ADMIN_AUTH_ENABLED: "${ADMIN_AUTH_ENABLED:-${PLANNER_ENABLED:-false}}"
      AUTH_GRPC_ADDR: auth:50050
      AUTHZ_GRPC_ADDR: authz:50051
      AUTH_RPC_TIMEOUT: "${AUTH_RPC_TIMEOUT:-5s}"
      AUTHZ_RPC_TIMEOUT: "${AUTHZ_RPC_TIMEOUT:-5s}"
      PLANNER_INTERVAL: "${PLANNER_INTERVAL:-300s}"
      PLANNER_HORIZON: "${PLANNER_HORIZON:-1h}"
      PLANNER_PREDICTOR: "${PLANNER_PREDICTOR:-ewma}"
      PLANNER_MODEL_DIR: "${PLANNER_MODEL_DIR:-}"
      PLANNER_MODEL_REGISTRY: /models/registry
      PLANNER_MODEL_MAX_AGE: "${PLANNER_MODEL_MAX_AGE:-72h}"
      PLANNER_MODEL_UPDATE_EVERY: "${PLANNER_MODEL_UPDATE_EVERY:-24h}"
      PLANNER_MODEL_MIN_HISTORY: "${PLANNER_MODEL_MIN_HISTORY:-26h}"
      PLANNER_MODEL_TRAIN_WINDOW: "${PLANNER_MODEL_TRAIN_WINDOW:-168h}"
      PLANNER_MODEL_TRAIN_TIMEOUT: "${PLANNER_MODEL_TRAIN_TIMEOUT:-30m}"
      PLANNER_TRAIN_COMMAND: "${PLANNER_TRAIN_COMMAND:-python -m sppr_ml train --data {data} --out {out} --params {params}}"
      PLANNER_MIN_GAIN_MS: "${PLANNER_MIN_GAIN_MS:-100}"
      PLANNER_PENALTY_MS_PER_MIB: "${PLANNER_PENALTY_MS_PER_MIB:-2}"
      PLANNER_HOT_UTILIZATION: "${PLANNER_HOT_UTILIZATION:-0.9}"
      METADATA_GRPC_ADDR: metadata:50052
      STORAGE_HOT_GRPC_ADDR: storage-hot:50053
      STORAGE_COLD_GRPC_ADDR: storage-cold:50053
    volumes:
      - ./build/models:/models:ro
      - sppr-model-registry:/models/registry
    cpus: 2
    mem_limit: 2g
    # Keep the administrator interface on loopback for the local stand.
    ports:
      - "127.0.0.1:${SPPR_HTTP_PORT:-8086}:8086"
    networks: [opens3-network]
    restart: unless-stopped
    depends_on:
      postgres-sppr:
        condition: service_healthy
      migrator-sppr:
        condition: service_completed_successfully
      kafka:
        condition: service_healthy
    healthcheck:
      test: [CMD, wget, -q, -O, /dev/null, "http://localhost:8086/readyz"]
      interval: 5s
      timeout: 3s
      retries: 5
      start_period: 15s

  # ── Infrastructure ─────────────────────────────────────────────────────────
  # Стартует всегда: docker compose up
  # Только инфра:   docker compose up (без --profile)

  postgres-users:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ${USERS_DB_NAME:-users_db}
      POSTGRES_USER: ${USERS_DB_USER:-users_user}
      POSTGRES_PASSWORD: ${USERS_DB_PASSWORD:-users_password}
    ports:
      - "${USERS_DB_PORT:-5432}:5432"
    volumes:
      - pgdata-users:/var/lib/postgresql/data
    networks:
      - opens3-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${USERS_DB_USER:-users_user} -d ${USERS_DB_NAME:-users_db}"]
      interval: 2s
      timeout: 1s
      retries: 15
      start_period: 5s

  postgres-metadata:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ${METADATA_DB_NAME:-metadata_db}
      POSTGRES_USER: ${METADATA_DB_USER:-metadata_user}
      POSTGRES_PASSWORD: ${METADATA_DB_PASSWORD:-metadata_password}
    ports:
      - "${METADATA_DB_PORT:-5433}:5432"
    volumes:
      - pgdata-metadata:/var/lib/postgresql/data
    networks:
      - opens3-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${METADATA_DB_USER:-metadata_user} -d ${METADATA_DB_NAME:-metadata_db}"]
      interval: 2s
      timeout: 1s
      retries: 15
      start_period: 5s

  postgres-metadata-e2e:
    profiles: [e2e]
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ${E2E_METADATA_DB_NAME:-metadata_e2e_db}
      POSTGRES_USER: ${E2E_METADATA_DB_USER:-metadata_e2e_user}
      POSTGRES_PASSWORD: ${E2E_METADATA_DB_PASSWORD:-metadata_e2e_password}
    ports:
      - "${E2E_METADATA_DB_PORT:-5434}:5432"
    networks:
      - opens3-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${E2E_METADATA_DB_USER:-metadata_e2e_user} -d ${E2E_METADATA_DB_NAME:-metadata_e2e_db}"]
      interval: 2s
      timeout: 1s
      retries: 15
      start_period: 5s

  redis:
    image: redis:7.4-alpine
    command: ["redis-server", "--save", "", "--appendonly", "no"]
    ports:
      - "${REDIS_PORT:-6379}:6379"
    networks:
      - opens3-network
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 2s
      timeout: 1s
      retries: 15
      start_period: 3s

  neo4j:
    image: neo4j:5.21.0
    environment:
      NEO4J_AUTH: neo4j/${NEO4J_PASSWORD:-password123}
      NEO4J_PLUGINS: '["graph-data-science"]'
      NEO4J_dbms_memory_pagecache_size: 512M
    ports:
      - "${NEO4J_HTTP_PORT:-7474}:7474"
      - "${NEO4J_BOLT_PORT:-7687}:7687"
    volumes:
      - neo4j-data:/data
      - neo4j-logs:/logs
      - neo4j-plugins:/plugins
    networks:
      - opens3-network
    healthcheck:
      test: ["CMD-SHELL", "wget --quiet --spider http://localhost:7474 || exit 1"]
      interval: 5s
      timeout: 3s
      retries: 20
      start_period: 15s

  zookeeper:
    image: confluentinc/cp-zookeeper:7.7.0
    hostname: zookeeper
    environment:
      ZOOKEEPER_CLIENT_PORT: 2181
      ZOOKEEPER_TICK_TIME: 2000
    ports:
      - "2181:2181"
    networks:
      - opens3-network

    healthcheck:
      test: ["CMD", "cub", "zk-ready", "localhost:2181", "5"]
      interval: 5s
      timeout: 10s
      retries: 20
      start_period: 10s

  kafka:
    image: confluentinc/cp-kafka:7.7.0
    hostname: kafka
    depends_on:
      zookeeper:
        condition: service_healthy
    environment:
      KAFKA_BROKER_ID: 1
      KAFKA_ZOOKEEPER_CONNECT: zookeeper:2181
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT
      KAFKA_LISTENERS: PLAINTEXT://kafka:29092,PLAINTEXT_HOST://0.0.0.0:9092
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:29092,PLAINTEXT_HOST://localhost:9092
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
    ports:
      - "9092:9092"
    networks:
      - opens3-network
    healthcheck:
      test: ["CMD-SHELL", "kafka-broker-api-versions --bootstrap-server localhost:9092 || exit 1"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 15s

  # ── Services ───────────────────────────────────────────────────────────────
  # docker compose --profile services up

  migrator-metadata:
    profiles: [services]
    build:
      context: ./services/metadata
      dockerfile: migrator.Dockerfile
    env_file:
      - services/metadata/.env
    networks:
      - opens3-network
    restart: on-failure
    depends_on:
      postgres-metadata:
        condition: service_healthy

  migrator-users:
    profiles: [services]
    build:
      context: ./services/users
      dockerfile: migrator.Dockerfile
    env_file:
      - services/users/.env
    networks:
      - opens3-network
    restart: on-failure
    depends_on:
      postgres-users:
        condition: service_healthy

  users:
    profiles: [services]
    build:
      context: .
      dockerfile: services/users/Dockerfile
    ports:
      - "50054:50054"
    env_file:
      - services/users/.env
    networks:
      - opens3-network
    restart: unless-stopped
    depends_on:
      postgres-users:
        condition: service_healthy
      migrator-users:
        condition: service_completed_successfully

  auth:
    profiles: [services]
    build:
      context: .
      dockerfile: services/auth/Dockerfile
    ports:
      - "50050:50050"
    env_file:
      - services/auth/.env
    networks:
      - opens3-network
    restart: unless-stopped
    depends_on:
      redis:
        condition: service_healthy
      users:
        condition: service_started

  authz:
    profiles: [services]
    build:
      context: .
      dockerfile: services/authz/Dockerfile
    ports:
      - "50051:50051"
    env_file:
      - services/authz/.env
    networks:
      - opens3-network
    restart: unless-stopped
    depends_on:
      neo4j:
        condition: service_healthy
      redis:
        condition: service_healthy
      kafka:
        condition: service_healthy

  metadata:
    profiles: [services]
    build:
      context: .
      dockerfile: services/metadata/Dockerfile
    ports:
      - "50052:50052"
    env_file:
      - services/metadata/.env
    environment:
      # Blobs of a deleted object stay until GETs started before DELETE finish;
      # Metadata refuses to start unless the delay exceeds the Gateway read limit.
      METADATA_DELETE_CLEANUP_DELAY: "${METADATA_DELETE_CLEANUP_DELAY:-10m}"
      GATEWAY_MAX_READ_DURATION: "${GATEWAY_MAX_READ_DURATION:-5m}"
    networks:
      - opens3-network
    restart: unless-stopped
    depends_on:
      postgres-metadata:
        condition: service_healthy
      kafka:
        condition: service_healthy
      migrator-metadata:
        condition: service_completed_successfully

  # Два экземпляра Storage на разных томах: класс хранения версии хранит Metadata,
  # Gateway выбирает экземпляр по нему. COLD остаётся на прежнем томе storage-data:
  # миграция Metadata отнесла все существующие версии к COLD.
  storage-cold:
    profiles: [services]
    build:
      context: .
      dockerfile: services/storage/Dockerfile
    ports:
      - "50053:50053"
    env_file:
      - services/storage/.env
    environment:
      STORAGE_RETRIEVE_CHUNK_SIZE_BYTES: "${STORAGE_RETRIEVE_CHUNK_SIZE_BYTES:-1048576}"
      OTEL_SERVICE_NAME: "storage_cold"
    volumes:
      - storage-data:/data
    networks:
      - opens3-network
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "nc", "-z", "localhost", "50053"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 5s

  storage-hot:
    profiles: [services]
    build:
      context: .
      dockerfile: services/storage/Dockerfile
    ports:
      - "50056:50053"
    env_file:
      - services/storage/.env
    environment:
      STORAGE_RETRIEVE_CHUNK_SIZE_BYTES: "${STORAGE_RETRIEVE_CHUNK_SIZE_BYTES:-1048576}"
      OTEL_SERVICE_NAME: "storage_hot"
    volumes:
      - storage-hot-data:/data
    networks:
      - opens3-network
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "nc", "-z", "localhost", "50053"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 5s

  quota:
    profiles: [services]
    build:
      context: .
      dockerfile: services/quota/Dockerfile
    ports:
      - "50055:50055"
    env_file:
      - services/quota/.env
    environment:
      - REDIS_HOST=redis
      - ENABLE_OTLP=true
      - OTLP_ENDPOINT=http://otel-collector:4317
    networks:
      - opens3-network
    restart: unless-stopped
    depends_on:
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "nc", "-z", "localhost", "50055"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 10s

  gateway:
    profiles: [services]
    build:
      context: .
      dockerfile: services/gateway/Dockerfile
    ports:
      - "127.0.0.1:8080:8080"
    environment:
      GATEWAY_HTTP_ADDR: ":8080"
      ACCESS_EVENTS_ENABLED: "${ACCESS_EVENTS_ENABLED:-true}"
      GATEWAY_ID: "${GATEWAY_ID:-gateway-1}"
      KAFKA_BOOTSTRAP: "kafka:29092"
      KAFKA_OBJECT_READ_TOPIC: "${KAFKA_OBJECT_READ_TOPIC:-object-read}"
      KAFKA_OBJECT_WRITTEN_TOPIC: "${KAFKA_OBJECT_WRITTEN_TOPIC:-object-written}"
      METADATA_GRPC_ADDR: "metadata:50052"
      METADATA_RPC_TIMEOUT: "${METADATA_RPC_TIMEOUT:-5s}"
      STORAGE_HOT_GRPC_ADDR: "storage-hot:50053"
      STORAGE_COLD_GRPC_ADDR: "storage-cold:50053"
      GATEWAY_MAX_READ_DURATION: "${GATEWAY_MAX_READ_DURATION:-5m}"
      STORAGE_RETRIEVE_CHUNK_SIZE_BYTES: "${STORAGE_RETRIEVE_CHUNK_SIZE_BYTES:-1048576}"
      LOGGER_LEVEL: "${GATEWAY_LOGGER_LEVEL:-info}"
      LOGGER_AS_JSON: "${GATEWAY_LOGGER_AS_JSON:-false}"
      LOGGER_ENABLE_OLTP: "${GATEWAY_LOGGER_ENABLE_OTLP:-false}"
      OTEL_ENABLED: "${GATEWAY_OTEL_ENABLED:-false}"
      OTEL_SERVICE_NAME: "gateway"
      OTEL_SERVICE_VERSION: "${GATEWAY_SERVICE_VERSION:-dev}"
      OTEL_ENVIRONMENT: "${GATEWAY_ENVIRONMENT:-local}"
      OTEL_EXPORTER_OTLP_ENDPOINT: "${GATEWAY_OTLP_ENDPOINT:-otel-collector:4317}"
      OTEL_METRICS_PUSH_TIMEOUT: "${GATEWAY_METRICS_PUSH_TIMEOUT:-30s}"
    networks:
      - opens3-network
    restart: unless-stopped
    depends_on:
      metadata:
        condition: service_started
      storage-hot:
        condition: service_healthy
      storage-cold:
        condition: service_healthy
      kafka:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:8080/healthz"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 5s

  # ── Observability ──────────────────────────────────────────────────────────
  # docker compose --profile observability up

  otel-collector:
    profiles: [observability]
    image: otel/opentelemetry-collector-contrib:0.123.0
    command: ["--config=/etc/otel-collector-config.yaml"]
    env_file:
      - infra/otel/.env
    volumes:
      - ./infra/otel/otel-collector-config.yaml:/etc/otel-collector-config.yaml
    ports:
      - "4317:4317"
      - "4318:4318"
      - "8888:8888"
    networks:
      - opens3-network
    restart: unless-stopped
    depends_on:
      jaeger:
        condition: service_started
      elasticsearch:
        condition: service_healthy
      prometheus:
        condition: service_started

  jaeger:
    profiles: [observability]
    image: jaegertracing/jaeger:2.6.0
    ports:
      - "${JAEGER_UI_PORT:-16686}:16686"
    environment:
      COLLECTOR_OTLP_ENABLED: "true"
      STORAGE_TYPE: badger
      BADGER_EPHEMERAL: "false"
      BADGER_DIRECTORY_VALUE: /badger/data
      BADGER_DIRECTORY_KEY: /badger/key
      BADGER_TTL: 168h
    volumes:
      - jaeger-data:/badger/data
    networks:
      - opens3-network
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "localhost:${JAEGER_UI_PORT:-16686}"] # UI availability check
      interval: 5s # Check interval
      timeout: 3s # Check timeout
      retries: 3 # Retry attempts
      start_period: 5s # Delay before starting checks
    restart: unless-stopped

  prometheus:
    profiles: [observability]
    image: prom/prometheus:v3.3.1
    env_file:
      - infra/otel/.env
    ports:
      - "${PROMETHEUS_PORT:-9090}:9090"
    volumes:
      - ./infra/otel/prometheus.yml:/etc/prometheus/prometheus.yml
      - prometheus-data:/prometheus
    command:
      - "--config.file=/etc/prometheus/prometheus.yml"
      - "--storage.tsdb.path=/prometheus"
      - "--web.enable-lifecycle"
      - "--web.enable-remote-write-receiver"
    networks:
      - opens3-network
    healthcheck:
      test: [ "CMD", "wget", "--quiet", "--spider", "http://localhost:${PROMETHEUS_PORT:-9090}/-/healthy" ]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s
    restart: unless-stopped

  grafana:
    profiles: [observability]
    image: grafana/grafana:12.0.0
    env_file:
      - infra/otel/.env
    ports:
      - "${GRAFANA_PORT:-3000}:3000"
    volumes:
      - grafana-data:/var/lib/grafana
      - ./infra/otel/grafana/provisioning:/etc/grafana/provisioning
      - ./infra/otel/grafana/dashboards:/var/lib/grafana/dashboards
    networks:
      - opens3-network

    healthcheck:
      test: [ "CMD", "wget", "--quiet", "--spider", "http://localhost:${GRAFANA_PORT:-3000}/api/health" ]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s

    restart: unless-stopped
    depends_on:
      - prometheus

  elasticsearch:
    profiles: [observability]
    image: docker.elastic.co/elasticsearch/elasticsearch:9.0.4
    container_name: elasticsearch
    environment:
      - discovery.type=single-node
      - xpack.security.enabled=false
      - cluster.name=es-docker-cluster
      - ES_JAVA_OPTS=-Xms512m -Xmx512m
    deploy:
      resources:
        limits:
          memory: 1g
    volumes:
      - es_data:/usr/share/elasticsearch/data

    env_file:
      - infra/otel/.env

    ports:
      - "${ES_PORT:-9200}:9200"

    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:9200/_cluster/health >/dev/null"]
      interval: 10s
      timeout: 5s
      retries: 20
      start_period: 30s

    restart: unless-stopped

    networks:
      - opens3-network

  kibana:
    profiles: [observability]
    image: docker.elastic.co/kibana/kibana:9.0.4
    container_name: kibana
    environment:
      - ELASTICSEARCH_HOSTS=http://elasticsearch:9200
      - XPACK_SECURITY_ENABLED=false
      - xpack.encryptedSavedObjects.encryptionKey=REPLACE_WITH_32+_CHAR_STRING
    
    depends_on:
      elasticsearch:
        condition: service_healthy
    
    env_file:
      - infra/otel/.env

    ports:
      - "${KIBANA_PORT:-5601}:5601"

    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:5601/api/status >/dev/null"]
      interval: 10s
      timeout: 5s
      retries: 20
      start_period: 30s
    
    restart: unless-stopped
    networks:
      - opens3-network

  kibana-init:
    profiles: [observability]
    image: alpine:3.21
    container_name: kibana-init
    depends_on:
      kibana:
        condition: service_healthy
    env_file:
      - infra/otel/.env

    command: 
      - sh
      - -c
      - |
        set -e # stop scipt after first error
        
        echo "Installing curl and jq..."
        apk add --no-cache curl jq >/dev/null 2>&1
        
        echo "Waiting for Kibana..."
        # max 60 attempts with delay 2 seconds
        for i in $$(seq 1 60); do
          if curl -sSf http://kibana:5601/api/status >/dev/null; then break; fi
          sleep 2
        done
        
        echo "Creating Data View logs* ..."
        RESPONSE=$$(curl -sS -X POST http://kibana:5601/api/data_views/data_view \
          -H "kbn-xsrf: true" \
          -H "Content-Type: application/json" \
          --data '{"data_view":{"title":"logs*","name":"Logs","timeFieldName":"@timestamp","allowNoIndex":true},"override":true}' || echo "{}")
        
        echo "Response: $$RESPONSE"
        DATA_VIEW_ID=$$(echo "$$RESPONSE" | jq -r ".data_view.id // empty")
        echo "Data View ID: $$DATA_VIEW_ID"
        
        # Making Data View default in Kibana
        if [ -n "$$DATA_VIEW_ID" ]; then
          echo "Setting as default data view..."
          curl -sS -X POST http://kibana:5601/api/data_views/default \
            -H "kbn-xsrf: true" \
            -H "Content-Type: application/json" \
            -d "{\"data_view_id\": \"$$DATA_VIEW_ID\", \"force\": true}" || true
          echo "Default data view set successfully."
        else
          echo "Failed to get data view ID"
        fi
        echo "Done."
    
    networks:
      - opens3-network
    
    restart: "no"
