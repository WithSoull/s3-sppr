basePath: /
info:
  contact: {}
  description: Minimal object PUT/GET without authentication, authorization, quota
    or S3 compatibility. Do not expose publicly.
  title: OpenS3 Gateway (development API)
  version: 0.1.0
paths:
  /objects/{bucket}/{key}:
    delete:
      description: 'Development-only API. Removes the object from Metadata, so later
        GET returns 404. Blobs stay in Storage: cleanup is not implemented yet.'
      parameters:
      - description: Bucket name
        in: path
        name: bucket
        required: true
        type: string
      - description: Object key (may contain slashes)
        in: path
        name: key
        required: true
        type: string
      responses:
        "204":
          description: No Content
        "404":
          description: Not Found
          schema:
            type: string
        "502":
          description: Bad Gateway
          schema:
            type: string
        "503":
          description: Service Unavailable
          schema:
            type: string
        "504":
          description: Gateway Timeout
          schema:
            type: string
      summary: Delete an object from the catalog
      tags:
      - objects
    get:
      description: Development-only API. Streams object bytes from the Storage of
        the version's class. Supports one byte range; a Range header with several
        ranges or invalid syntax is ignored. Version selection is not supported. The
        whole request is bounded by GATEWAY_MAX_READ_DURATION.
      parameters:
      - description: Bucket name
        in: path
        name: bucket
        required: true
        type: string
      - description: Object key (may contain slashes)
        in: path
        name: key
        required: true
        type: string
      - description: 'One byte range: bytes=first-last, bytes=first- or bytes=-suffix'
        in: header
        name: Range
        type: string
      - description: Strong ETag; the range applies only to the version with this
          ETag, otherwise the whole object is returned
        in: header
        name: If-Range
        type: string
      produces:
      - application/octet-stream
      responses:
        "200":
          description: OK
          schema:
            type: file
        "206":
          description: Partial Content
          schema:
            type: file
        "400":
          description: Bad Request
          schema:
            type: string
        "404":
          description: Not Found
          schema:
            type: string
        "416":
          description: Requested Range Not Satisfiable
          schema:
            type: string
        "502":
          description: Bad Gateway
          schema:
            type: string
        "503":
          description: Service Unavailable
          schema:
            type: string
        "504":
          description: Gateway Timeout
          schema:
            type: string
      summary: Read the current object version
      tags:
      - objects
    head:
      description: Development-only API. Calls Metadata only, without reading Storage
        or publishing object-read. Returns the headers of a full GET without a body.
        Range and If-Range are ignored. Bounded by METADATA_RPC_TIMEOUT, not GATEWAY_MAX_READ_DURATION.
      parameters:
      - description: Bucket name
        in: path
        name: bucket
        required: true
        type: string
      - description: Object key (may contain slashes)
        in: path
        name: key
        required: true
        type: string
      responses:
        "200":
          description: OK
          headers:
            Accept-Ranges:
              description: bytes
              type: string
            Content-Length:
              description: Full object size in bytes
              type: integer
            Content-Type:
              description: Object content type; application/octet-stream when empty
              type: string
            ETag:
              description: Quoted object ETag
              type: string
            X-Content-Type-Options:
              description: nosniff
              type: string
            X-Object-Version-Id:
              description: Current version ID
              type: string
        "404":
          description: Not Found
        "502":
          description: Bad Gateway
        "503":
          description: Service Unavailable
        "504":
          description: Gateway Timeout
      summary: Read metadata of the current object version
      tags:
      - objects
    put:
      consumes:
      - application/octet-stream
      description: Development-only API. No authentication, authorization or quota
        enforcement. A failed response after Storage may have an unknown Metadata
        outcome; do not retry blindly.
      parameters:
      - description: Bucket name
        in: path
        name: bucket
        required: true
        type: string
      - description: Object key (may contain slashes)
        in: path
        name: key
        required: true
        type: string
      - description: Raw object bytes
        in: body
        name: body
        required: true
        schema:
          type: string
      - description: MIME type
        in: header
        name: Content-Type
        type: string
      responses:
        "200":
          description: OK
        "400":
          description: Bad Request
          schema:
            type: string
        "404":
          description: Not Found
          schema:
            type: string
        "502":
          description: Bad Gateway
          schema:
            type: string
        "503":
          description: Service Unavailable
          schema:
            type: string
        "504":
          description: Gateway Timeout
          schema:
            type: string
        "507":
          description: Insufficient Storage
          schema:
            type: string
      summary: Store an object in an existing bucket
      tags:
      - objects
schemes:
- http
swagger: "2.0"
